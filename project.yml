name: mountainView
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: true
targets:
  mountainView:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
        excludes:
          - Resources
      - Sources/Terrain
      - path: Sources/App/Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: mountainView
        UILaunchScreen: {}
        NSCameraUsageDescription: "mountainView overlays the terrain on the live camera in AR mode."
        NSLocationWhenInUseUsageDescription: "mountainView uses your location to render the terrain panorama around you."
        NSMotionUsageDescription: "mountainView uses motion sensors so you can look around by turning the phone."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mountainView
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ReliefRender:
    type: tool
    platform: macOS
    sources:
      - Sources/Terrain
      - Tools/ReliefRender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ReliefRender
        SWIFT_VERSION: "5.0"
  mountainViewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: mountainView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mountainViewTests
        GENERATE_INFOPLIST_FILE: true
schemes:
  mountainView:
    build:
      targets:
        mountainView: all
        mountainViewTests: [test]
    test:
      targets:
        - mountainViewTests
  ReliefRender:
    build:
      targets:
        ReliefRender: all
    run:
      config: Debug
