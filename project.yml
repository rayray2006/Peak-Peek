name: PeakPeek
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: true
targets:
  PeakPeek:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
        excludes:
          - Resources
      - Sources/Terrain
      - path: Sources/App/Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PeakPeek
        UILaunchScreen: {}
        NSCameraUsageDescription: "PeakPeek overlays the terrain on the live camera in AR mode."
        NSLocationWhenInUseUsageDescription: "PeakPeek uses your location to render the terrain panorama around you."
        NSMotionUsageDescription: "PeakPeek uses motion sensors so you can look around by turning the phone."
        NSPhotoLibraryAddUsageDescription: "PeakPeek saves your captured panorama photos to your library."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        # Deliberately still the original identifier: changing it would give the
        # installed app a fresh container (DEM caches, saved lists, viewpoint all
        # lost) and break the simulator tooling recipes.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mountainView
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ReliefRender:
    type: tool
    platform: macOS
    sources:
      - Sources/Terrain
      - Tools/ReliefRender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ReliefRender
        SWIFT_VERSION: "5.0"
  PeakPeekTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: PeakPeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mountainViewTests
        GENERATE_INFOPLIST_FILE: true
schemes:
  PeakPeek:
    build:
      targets:
        PeakPeek: all
        PeakPeekTests: [test]
    test:
      targets:
        - PeakPeekTests
  ReliefRender:
    build:
      targets:
        ReliefRender: all
    run:
      config: Debug
