name: PeakPeek
options:
  bundleIdPrefix: com.weemotes
  deploymentTarget:
    iOS: "17.0"
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "5"
    DEVELOPMENT_TEAM: "NJ4Z2645XA"   # Farookh Mohammed (paid Apple Developer Program team)
    GENERATE_INFOPLIST_FILE: true
targets:
  PeakPeek:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
        excludes:
          - Resources
      - Sources/Terrain
      - path: Sources/App/Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Peak-Peek
        # Drive version/build from the shared settings above (xcodegen otherwise
        # hardcodes 1.0 / 1 into the generated Info.plist, so CURRENT_PROJECT_VERSION
        # bumps never reached the archive). Bump CURRENT_PROJECT_VERSION per upload.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSCameraUsageDescription: "Peak-Peek overlays the terrain on the live camera in AR mode."
        NSLocationWhenInUseUsageDescription: "Peak-Peek uses your location to render the terrain panorama around you."
        NSMotionUsageDescription: "Peak-Peek uses motion sensors so you can look around by turning the phone."
        UIAppFonts:
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - SpaceGrotesk-Bold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
        # All four: the unfolded iPhone Duo has no natural "top" with the hinge
        # horizontal, and without PortraitUpsideDown the interface stays put
        # while the body flips, so the IMU-driven horizon renders inverted.
        # (Classic Face ID iPhones never rotate to upside-down anyway.)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        # Shipping identifier (App Store / TestFlight). Changing it from the old
        # com.example.mountainView gives any INSTALLED build a fresh container
        # (DEM caches, saved lists, viewpoint reset) — a one-time cost; simulator
        # tooling that launches by bundle id must use this value now.
        PRODUCT_BUNDLE_IDENTIFIER: com.weemotes.peekpeak
        # iPhone-only (1). Universal (the default "1,2") would make App Store
        # validation demand iPad multitasking support as well; the app now
        # declares all four orientations anyway (for the unfolded Duo, above).
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ReliefRender:
    type: tool
    platform: macOS
    sources:
      - Sources/Terrain
      - Tools/ReliefRender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weemotes.ReliefRender
        SWIFT_VERSION: "5.0"
  PeakPeekTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: PeakPeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weemotes.peekpeakTests
        GENERATE_INFOPLIST_FILE: true
schemes:
  PeakPeek:
    build:
      targets:
        PeakPeek: all
        PeakPeekTests: [test]
    test:
      targets:
        - PeakPeekTests
  ReliefRender:
    build:
      targets:
        ReliefRender: all
    run:
      config: Debug
